<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivaChat - P2P AI-Moderated Chat</title>
  <!-- PeerJS for direct Peer-to-Peer messaging (No server stores data) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- TensorFlow.js & On-Device AI Toxicity Model (Runs 100% in browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity@1.2.2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #e1e1e6; display: flex; height: 100vh; justify-content: center; align-items: center; }
    
    .chat-container { width: 100%; max-width: 700px; height: 90vh; background: #202024; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    
    .header { padding: 16px; background: #29292e; border-bottom: 1px solid #323238; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 1.1rem; color: #00b37e; }
    .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: #323238; }

    .lobby { padding: 20px; background: #1a1a1e; border-bottom: 1px solid #323238; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #323238; background: #121214; color: #fff; font-size: 0.9rem; }
    input:focus { outline: 1px solid #00b37e; }
    button { background: #00b37e; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #00875f; }
    button:disabled { background: #555; cursor: not-allowed; }

    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; line-height: 1.4; word-break: break-word; }
    .msg.incoming { background: #29292e; align-self: flex-start; }
    .msg.outgoing { background: #015f43; align-self: flex-end; }
    .msg .author { font-size: 0.75rem; color: #a8a8b3; margin-bottom: 4px; }
    .msg.system { align-self: center; background: transparent; color: #8d8d99; font-size: 0.8rem; font-style: italic; }

    .input-bar { padding: 16px; background: #29292e; display: flex; gap: 10px; }
    .input-bar input { flex: 1; }
    
    .warning { color: #f75a68; font-size: 0.8rem; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h2>🔒 PrivaChat (E2E & Client AI)</h2>
    <span class="status-badge" id="ai-status">⏳ Loading AI Model...</span>
  </div>

  <div class="lobby">
    <input type="text" id="username" placeholder="Your Name" value="User">
    <button id="btn-create" onclick="createRoom()">Create Room</button>
    <input type="text" id="join-id" placeholder="Enter Room ID">
    <button id="btn-join" onclick="joinRoom()">Join Room</button>
  </div>

  <div class="messages" id="message-container">
    <div class="msg system">Welcome! No messages are ever saved on any server.</div>
  </div>

  <div class="input-bar">
    <div style="flex: 1; display: flex; flex-direction: column;">
      <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" disabled>
      <div class="warning" id="warning-text">⚠️ Message blocked by local AI: Flagged as toxic/abusive.</div>
    </div>
    <button id="btn-send" onclick="sendMessage()" disabled>Send</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let aiModel = null;
  const threshold = 0.85; // Sensitivity of AI filter (0.0 to 1.0)

  // 1. Load the TensorFlow.js Toxicity Model directly into the browser memory
  async function initAI() {
    try {
      aiModel = await toxicity.load(threshold);
      document.getElementById("ai-status").innerText = "🛡️ AI Auto-Mod Active";
      document.getElementById("ai-status").style.color = "#00b37e";
      document.getElementById("chat-input").disabled = false;
      document.getElementById("btn-send").disabled = false;
    } catch (e) {
      document.getElementById("ai-status").innerText = "⚠️ AI failed to load";
      console.error(e);
    }
  }
  initAI();

  // 2. Peer-to-Peer Room Creation
  function createRoom() {
    const randomRoomId = "room-" + Math.random().toString(36).substring(2, 8);
    peer = new Peer(randomRoomId);

    peer.on('open', (id) => {
      appendSystemMessage(`Room created! Share this Room ID with your friend: <b>${id}</b>`);
    });

    peer.on('connection', (c) => {
      conn = c;
      setupConnectionHandlers();
    });
  }

  // 3. Join an existing Room
  function joinRoom() {
    const roomId = document.getElementById("join-id").value.trim();
    if (!roomId) return alert("Please enter a Room ID!");

    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(roomId);
      setupConnectionHandlers();
    });
  }

  function setupConnectionHandlers() {
    conn.on('open', () => {
      appendSystemMessage("🔒 Secure Peer-to-Peer connection established!");
    });

    conn.on('data', (data) => {
      appendMessage(data.author, data.text, 'incoming');
    });

    conn.on('close', () => {
      appendSystemMessage("Peer disconnected.");
    });
  }

  // 4. Client-side AI Moderation Check & Message Sending
  async function sendMessage() {
    const input = document.getElementById("chat-input");
    const warning = document.getElementById("warning-text");
    const text = input.value.trim();

    if (!text) return;
    if (!conn) {
      alert("You need to create or join a room first!");
      return;
    }

    warning.style.display = "none";

    // Run on-device AI check before sending
    if (aiModel) {
      document.getElementById("ai-status").innerText = "🔍 AI scanning...";
      const predictions = await aiModel.classify([text]);
      document.getElementById("ai-status").innerText = "🛡️ AI Auto-Mod Active";

      // If any category (toxicity, insults, threats, etc.) matches
      const isToxic = predictions.some(p => p.results[0].match === true);

      if (isToxic) {
        warning.style.display = "block";
        return; // Block message from being sent
      }
    }

    const payload = {
      author: document.getElementById("username").value || "Anonymous",
      text: text
    };

    // Send directly over WebRTC
    conn.send(payload);
    appendMessage("You", text, 'outgoing');
    input.value = "";
  }

  function appendMessage(author, text, direction) {
    const box = document.getElementById("message-container");
    const msg = document.createElement("div");
    msg.className = `msg ${direction}`;
    msg.innerHTML = `<div class="author">${author}</div><div>${escapeHtml(text)}</div>`;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }

  function appendSystemMessage(htmlText) {
    const box = document.getElementById("message-container");
    const msg = document.createElement("div");
    msg.className = "msg system";
    msg.innerHTML = htmlText;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(string) {
    return String(string).replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }
</script>

</body>
</html>
